<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Identification Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400&family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* IDENTIFICATION QUIZ PAGE SPECIFIC STYLES */
        
        .quiz-content-scroll {
            position: absolute;
            top: 80px;
            bottom: 90px;
            left: 0;
            right: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }
        
        .quiz-content-scroll::-webkit-scrollbar {
            display: none;
        }
        
        /* Question Card */
        .quiz-question-card {
            background: #e9e9e9;
            border-radius: 12px;
            padding: 16px;
            margin: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .quiz-card-header {
            display: flex;
            gap: 12px;
        }
        
        .quiz-card-header input {
            flex: 1;
            border: none;
            border-bottom: 1px solid #bbb;
            background: transparent;
            padding: 8px 4px;
            font-size: 14px;
            font-family: 'Inria Sans', sans-serif;
            color: #888;
            outline: none;
        }
        
        .quiz-card-header input::placeholder {
            color: #aaa;
            font-style: italic;
        }
        
        .quiz-question-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 20px;
            font-family: 'Inria Sans', sans-serif;
            color: #666;
            resize: none;
            outline: none;
            min-height: 60px;
        }
        
        .quiz-question-input::placeholder {
            color: #999;
        }
        
        /* Answer Card */
        .quiz-answer-card {
            background: #e9e9e9;
            border-radius: 12px;
            padding: 20px 16px;
            margin: 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .answer-label {
            font-size: 15px;
            color: #333;
            align-self: flex-start;
            font-family: 'Inria Sans', sans-serif;
        }
        
        .answer-input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background: #87CEEB;
            font-size: 15px;
            font-family: 'Inria Sans', sans-serif;
            color: #1a1a2e;
            outline: none;
            line-height: 1.4;
        }
        
        .answer-input::placeholder {
            color: #1a1a2e;
            opacity: 0.9;
        }
        
        .answer-input:focus {
            background: #6BB6FF;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- NAV -->
        <nav class="nav">
            <span class="hamburger" onclick="toggleSidebar()">&#9776;</span>
            <img src="bell.png" class="bell" alt="Notifications">
        </nav>

        <!-- SIDEBAR -->
        <div class="nav-links" id="sidebar">
            <div class="top-icons">
                <img src="FAQIcon.png" class="help" alt="Help">
                <img src="back.png" class="back" onclick="toggleSidebar()" alt="Close">
            </div>

            <label for="imageInput">
                <img id="preview" src="acc.png" alt="Upload Image">
            </label>
            <input type="file" id="imageInput" accept="image/*" hidden>

            <h3>Insert Username</h3>
            <p>username@gmail.com</p>

            <a href="homepage.html">Home</a>
            <a href="#">Notes</a>
            <a href="#">Analytics</a>
            <a href="#">Leaderboard</a>
            <a href="settings.html">Settings</a>
            <a href="index.html">Log out</a>
        </div>

        <!-- OVERLAY -->
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

        <!-- MAIN CONTENT -->
        <div class="quiz-content-scroll">
            
            <!-- QUESTION CARD -->
            <div class="quiz-question-card">
                <div class="quiz-card-header">
                    <input type="text" placeholder="(Subject)" id="subjectInput">
                    <input type="text" placeholder="(Question)" id="questionNumInput">
                </div>
                <textarea class="quiz-question-input" placeholder="(insert question here)" id="questionInput" rows="3"></textarea>
            </div>

            <!-- ANSWER CARD -->
            <div class="quiz-answer-card">
                <p class="answer-label">What is the correct answer?</p>
                <input type="text" class="answer-input" placeholder="(Type the correct answer here)" id="answerInput">
            </div>

        </div>

        <!-- BOTTOM BAR -->
        <div class="bottom-file-section">
            <div class="item" onclick="addQuestion()">
                <img src="add.png" alt="Add">
                <p>Add</p>
            </div>

            <div class="item" onclick="triggerUpload()">
                <img src="uploaded.png" alt="Uploads">
                <p>Uploads</p>
            </div>

            <div class="item" onclick="goBack()">
                <img src="back.png" alt="Back">
                <p>Back</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        // Sidebar toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
        
        // Add question
        function addQuestion() {
            const subject = document.getElementById('subjectInput').value;
            const question = document.getElementById('questionInput').value;
            const answer = document.getElementById('answerInput').value;
            
            if (!subject || !question) {
                alert('Please fill in subject and question first!');
                return;
            }
            
            if (!answer) {
                alert('Please type the correct answer!');
                return;
            }
            
            let questions = JSON.parse(localStorage.getItem('quizQuestions') || '[]');
            questions.push({
                id: Date.now(),
                subject: subject,
                question: question,
                type: 'identification',
                answer: answer
            });
            localStorage.setItem('quizQuestions', JSON.stringify(questions));
            
            // Clear inputs
            document.getElementById('questionInput').value = '';
            document.getElementById('questionNumInput').value = '';
            document.getElementById('answerInput').value = '';
            
            alert('Question added!');
        }
        
        // Upload trigger
        function triggerUpload() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.doc,.docx,.txt,image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) alert('Uploaded: ' + file.name);
            };
            input.click();
        }
        
        // Go back
        function goBack() {
            window.location.href = 'flashcards.html';
        }
        
        // Profile image
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                    localStorage.setItem('userAvatar', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });
        
        // Load saved avatar
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('userAvatar');
            if (saved) document.getElementById('preview').src = saved;
        });
    </script>
</body>
</html>
